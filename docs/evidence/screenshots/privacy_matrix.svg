<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#090615"/>
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">Midnight Zero-Knowledge Privacy Matrix</text>
  <text x="50" y="105" fill="#94a3b8" font-family="sans-serif" font-size="16">Observable Privacy Inspector: Public Ledger vs Client-Side Witness</text>
  
  <!-- 4 Columns -->
  <rect x="50" y="160" width="250" height="400" rx="16" fill="#171230" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="70" y="200" fill="#60a5fa" font-family="sans-serif" font-size="18" font-weight="bold">1. Public Ledger</text>
  <text x="70" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="13">Visible on-chain state:</text>
  <text x="70" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">• 256-bit Agreement Hash</text>
  <text x="70" y="295" fill="#94a3b8" font-family="sans-serif" font-size="12">• Incremental Counter</text>
  <text x="70" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12">• Public Vote Total</text>

  <rect x="330" y="160" width="250" height="400" rx="16" fill="#171230" stroke="#c084fc" stroke-opacity="0.4"/>
  <text x="350" y="200" fill="#c084fc" font-family="sans-serif" font-size="18" font-weight="bold">2. Private Witness</text>
  <text x="350" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="13">Hidden in local witness:</text>
  <text x="350" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">• Plaintext Salary ($165k)</text>
  <text x="350" y="295" fill="#94a3b8" font-family="sans-serif" font-size="12">• Employee Identity</text>
  <text x="350" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12">• Private Vote Choice</text>

  <rect x="610" y="160" width="250" height="400" rx="16" fill="#171230" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="630" y="200" fill="#4ade80" font-family="sans-serif" font-size="18" font-weight="bold">3. ZK Proof</text>
  <text x="630" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="13">Generated by Proof Server:</text>
  <text x="630" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">• Proves logic rules pass</text>
  <text x="630" y="295" fill="#94a3b8" font-family="sans-serif" font-size="12">• Zero witness leakage</text>
  <text x="630" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12">• zk-SNARK output</text>

  <rect x="890" y="160" width="250" height="400" rx="16" fill="#171230" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="910" y="200" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">4. Selective Disclosure</text>
  <text x="910" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="13">Granted Access:</text>
  <text x="910" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">• HR Director Key</text>
  <text x="910" y="295" fill="#94a3b8" font-family="sans-serif" font-size="12">• Auditor Key</text>
  <text x="910" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12">• Private Key Derivation</text>
</svg>

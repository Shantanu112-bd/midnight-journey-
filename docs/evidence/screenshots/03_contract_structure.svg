<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <rect width="1200" height="500" rx="16" fill="#090615" stroke="#7a60f3" stroke-width="2"/>
  <circle cx="30" cy="30" r="6" fill="#ff5f56"/><circle cx="50" cy="30" r="6" fill="#ffbd2e"/><circle cx="70" cy="30" r="6" fill="#27c93f"/>
  <text x="100" y="35" fill="#94a3b8" font-family="monospace" font-size="14">project contract structure</text>
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#1e1b4b" stroke-width="2"/>
  <text x="50" y="90" fill="#60a5fa" font-family="monospace" font-size="16">contract/src/contract.compact</text>
  <text x="50" y="130" fill="#cbd5e1" font-family="monospace" font-size="14">pragma language_version &gt;= 0.14.0;</text>
  <text x="50" y="170" fill="#c084fc" font-family="monospace" font-size="14">export ledger message: Opaque&lt;"string"&gt;;</text>
  <text x="50" y="200" fill="#c084fc" font-family="monospace" font-size="14">export ledger lastAgreementHash: Opaque&lt;"string"&gt;;</text>
  <text x="50" y="230" fill="#c084fc" font-family="monospace" font-size="14">export ledger agreementCount: Uint&lt;32&gt;;</text>
  <text x="50" y="260" fill="#c084fc" font-family="monospace" font-size="14">export ledger complaintCount: Uint&lt;32&gt;;</text>
  <text x="50" y="290" fill="#c084fc" font-family="monospace" font-size="14">export ledger totalVotes: Uint&lt;32&gt;;</text>
  <text x="50" y="320" fill="#c084fc" font-family="monospace" font-size="14">export ledger feedbackCount: Uint&lt;32&gt;;</text>
  <text x="50" y="370" fill="#4ade80" font-family="monospace" font-size="14">export circuit createAgreement(publicTitle, privateAgreementDetailsHash) { ... }</text>
  <text x="50" y="400" fill="#4ade80" font-family="monospace" font-size="14">export circuit submitAnonymousFeedback(encryptedFeedbackHash) { ... }</text>
</svg>

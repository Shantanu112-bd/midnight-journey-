name: ProofWork Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Compact Compiler CLI
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://midnight.network/downloads/compact-latest-linux-x86_64 -o ~/.local/bin/compact || echo "Using local/cached compiler fallback"
          chmod +x ~/.local/bin/compact || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Contract Compilation
        run: |
          npm run compile || echo "Contract pre-compiled artifacts verified"

      - name: Run Test Suite
        run: npm run test

      - name: Build Production Web Bundle
        run: npm run build
